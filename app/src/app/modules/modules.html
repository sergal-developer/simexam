<div class="root-loader" *ngIf="uiServices._loader.show">
    <lu-icon [icon]="luIcon.badge"></lu-icon>
</div>

<div class="screen-component {{ uistate }} {{ uisubstate }}">
    <div class="screen-container {{ '__' + screen }}">

        <div class="screen-module" [ngClass]="{'open': screen === _screen.register }">
            <register class="_screen screen_register" *ngIf="screen === _screen.register"
                (onChange)="onChangeUI($event)"></register>
        </div>

        <div class="screen-module" [ngClass]="{'open': screen === _screen.dashboard }">
            <dashboard [selected]="submodule" class="_screen screen_main" *ngIf="screen === _screen.dashboard"
                (onChange)="onChangeUI($event)"></dashboard>
        </div>

        <div class="screen-module" [ngClass]="{'open': screen === _screen.settings }">
            <settings class="_screen screen_settings" *ngIf="screen === _screen.settings"></settings>
        </div>

        <div class="screen-module" [ngClass]="{'open': screen === _screen.quizcreate }">
            <quiz-editable [typeQuiz]="type" class="_screen screen_quiz"
                *ngIf="screen === _screen.quizcreate"></quiz-editable>
        </div>

        <div class="screen-module" [ngClass]="{'open': screen === _screen.quizedit }">
            <quiz-editable [quizId]="submodule" [typeQuiz]="type" class="_screen screen_quiz"
                *ngIf="screen === _screen.quizedit"></quiz-editable>
        </div>

        <div class="screen-module" [ngClass]="{'open': screen === _screen.attemptevalue }">
            <quiz-view [id]="submodule" [review]="false" class="_screen screen_quiz"
                *ngIf="screen === _screen.attemptevalue" (onChange)="onChangeUI($event)"></quiz-view>
        </div>

        <div class="screen-module" [ngClass]="{'open': screen === _screen.attemptreview }">
            <quiz-view [id]="submodule" [review]="true" class="_screen screen_quiz"
                *ngIf="screen === _screen.attemptreview" (onChange)="onChangeUI($event)"></quiz-view>
        </div>

        <div class="screen-module" [ngClass]="{'open': screen === _screen.quizselection }">
            <quiz-selector class="_screen screen_quiz" *ngIf="screen === _screen.quizselection"></quiz-selector>
        </div>

        <div class="screen-module" [ngClass]="{'open': screen === _screen.dbclient }">
            <dbclient class="_screen screen_quiz" *ngIf="screen === _screen.dbclient"></dbclient>
        </div>

    </div>
</div>

<div class="background-component {{ uistate }} {{ uisubstate }}">
    <!-- <div class="background-component-wrapper"> -->
    <div class="background-item shape-1"><img src="../../assets/shape-1.svg" alt=""></div>
    <div class="background-item shape-2"><img src="../../assets/shape-2.svg" alt=""></div>
    <div class="background-item shape-3"><img src="../../assets/shape-3.svg" alt=""></div>
    <div class="background-item shape-4"><img src="../../assets/shape-4.svg" alt=""></div>
    <div class="background-item shape-5"><img src="../../assets/shape-5.svg" alt=""></div>
    <div class="background-item shape-6"><img src="../../assets/shape-6.svg" alt=""></div>
    <div class="background-item shape-7"><img src="../../assets/shape-7.svg" alt=""></div>
    <!-- </div> -->
</div>

<div class="notification {{ uiServices._notification.type }}" [ngClass]="{'show': uiServices._notification.show }">
    <div class="item" *ngIf="uiServices._notification.icon">
        <span class="material-icons">{{ uiServices._notification.icon }}</span>
    </div>
    <div class="item" [innerHTML]="uiServices._notification.text"></div>
    <div class="item actions">
        <button class="action" *ngIf="uiServices._notification.action.event"
            [innerHTML]="uiServices._notification.action.text" (click)="uiServices.emitAction()"></button>
        <button class="close" *ngIf="uiServices._notification.closeAction.show"
            (click)="uiServices.closeNotification()"> <span class="material-icons">close</span> </button>
    </div>
</div>
