<div class="arrange --column --gap-0 --height-88-vh" [ngClass]="{'--center': currentSection == 'results' }"
    *ngIf="attempt.questions[index]">
    <ng-container *ngIf="currentSection == 'quiz' && attempt.questions[index]">

        <div class="arrange --height-50 --center">
            <div class="-text -text-size-500" [innerHTML]="attempt.questions[index].question"></div>
        </div>

        <div class="arrange --column --height-50 --center">
            <div class="item">Seleciona las respuestas correctas.</div>

            <div class="item" *ngIf="statusScore">{{ statusScore }}</div>

            <div class="arrange --row {{numrows}} --divided-children-2">
                <ng-container *ngFor="let option of attempt.questions[index].answers">
                    <div class="arrange --row-nowrap --center" [ngClass]="{   
                                        'selected': option._selected,
                                        'incorrect': readonly && !option.popular,
                                        'correct': readonly && option.popular != 0,
                                        'disabled': savingData }" (click)="selectOption(option)">
                        <div class="_answer_selection font_variable">
                            <lu-icon *ngIf="readonly && option.isCorrect" [icon]="luIcon.correct"></lu-icon>
                            <lu-icon *ngIf="readonly && !option.isCorrect && !option._selected"
                                [icon]="luIcon.incorrect"></lu-icon>
                            <lu-icon *ngIf="readonly && !option.isCorrect && option._selected"
                                [icon]="luIcon.selected"></lu-icon>

                            <lu-icon *ngIf="!readonly && !option._selected" [icon]="luIcon.unselected"></lu-icon>
                            <lu-icon *ngIf="!readonly && option._selected" [icon]="luIcon.selected"></lu-icon>
                        </div>
                        <div class="-text -text-size-300" [innerHTML]="option.answer">
                        </div>
                        <div *ngIf="revealedQuiz || readonly" class="font_variable">
                            <div class="btn">
                                {{ option.popular }}
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>

        <div class="joined-elements --margin-top-auto">
            <button class="element" (click)="prevQuestion()" [disabled]="!index">
                <lu-icon [icon]="luIcon.left"></lu-icon>
                <span>{{ 'action_prev' | translate }}</span>
            </button>

            <button class="element" (click)="finishQuiz()" *ngIf="index == attempt.questions.length - 1">
                <span>{{ 'action_complete' | translate }}</span>
            </button>

            <button class="element" (click)="revealQuiz()" [disabled]="!optionsSelected.length" *ngIf="!calculatedQuiz">
                <span>Revelar</span>
            </button>

            <button class="element" (click)="nextQuestion()" [disabled]="!calculatedQuiz"
                *ngIf="index < attempt.questions.length - 1">
                <span>{{ 'action_next' | translate }}</span>
                <lu-icon [icon]="luIcon.right"></lu-icon>
            </button>
        </div>
    </ng-container>

    <ng-container *ngIf="currentSection == 'results'">
        <div class="arrange --column --align-center --gap-separation --padding-section">
            <div class="arrange">
                <div class="arrange --center -title -title-size-300">
                    Ronda completada
                </div>
            </div>

            <div class="item">
                {{ 'attempt_subtitle' | translate }}
            </div>

            <div class="arrange --row --divided-children-2">
                <div class="arrange --padding-relation --center">
                    <div class="-text -text-size-120">
                        Seccion con mas puntaje
                    </div>
                    <div class="-text -text-bold">
                        {{ attempt.highestScoreId }} <b class="_accent color">({{ attempt.highestScore }})</b>
                    </div>
                </div>

                <div class="arrange --padding-relation --center">
                    <div class="-text -text-size-120">Puntaje total</div>
                    <div class="-text -text-bold">{{ attempt.score }}</div>
                </div>
            </div>

            <div class="arrange --column">
                <div class="-title -title-size-160">{{ 'attempt_status_rating_correct' | translate }}</div>
                <div class="arrange --row --gap-joined --center">
                    <ng-container *ngFor="let item of attempt.questions; let i = index">
                        <button class="small" [ngClass]="{'correct': item.isCorrect }" (click)="gotoQuestion(i)">
                            {{ i + 1 }}
                            <div class="label-time">{{ item.score }}</div>
                        </button>
                    </ng-container>
                </div>
            </div>

            <div class="item arrange --center --padding">
                <button (click)="showQuiz()">
                    <div class="inner">
                        <span class="material-icons">
                            rule
                        </span>
                        {{ 'action_review' | translate }}
                    </div>
                </button>
            </div>

        </div>
    </ng-container>
</div>
