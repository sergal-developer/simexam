<div class="arrange --column --gap-0 --height-88-vh" [ngClass]="{'--center': currentSection == 'results' }"
    *ngIf="attempt.questions[index]">
    <ng-container *ngIf="currentSection == 'quiz' && attempt.questions[index]">

        <div class="arrange --height-93 --center">

            <div class="flash-card" [ngClass]="{'is-flipped': attempt.questions[index]._flip }"
                (click)="flipCurrentCard()">
                <div class="flash-card-inner">

                    <div class="flash-card-face flash-card-front -text -text-size-200"
                        [innerHTML]="attempt.questions[index].question">
                    </div>

                    <div class="flash-card-face flash-card-back -text -text-size-200"
                        [innerHTML]="attempt.questions[index].answer">
                    </div>

                </div>
            </div>


        </div>

        <div class="joined-elements --margin-top-auto">
            <button class="element" (click)="prevQuestion()" [disabled]="!index">
                <lu-icon [icon]="luIcon.left"></lu-icon>
                <span>{{ 'action_prev' | translate }}</span>
            </button>

            <button class="element" (click)="finishQuiz()" *ngIf="index == attempt.questions.length - 1">
                <span>{{ 'action_complete' | translate }}</span>
            </button>

            <button class="element" (click)="nextQuestion()" *ngIf="index < attempt.questions.length - 1"
                [disabled]="!indexFliped">
                <span>{{ 'action_next' | translate }}</span>
                <lu-icon [icon]="luIcon.right"></lu-icon>
            </button>
        </div>
    </ng-container>

    <ng-container *ngIf="currentSection == 'results'">
        <div class="arrange --column --align-center --gap-separation --padding-section">
            <div class="arrange">
                <div class="arrange --center -title -title-size-300">
                    <ng-container *ngIf="attempt._grade == _gradeState.finished">
                        <span>{{ 'attempt_status_finished' | translate }}</span>
                        <span class="material-icons">
                            verified
                        </span>
                    </ng-container>
                </div>
            </div>

            <div class="item">
                Felicidades has completado una ronda de tarjetas, a continuacion se muestran los tiiempos generales y
                por tarjeta
            </div>

            <div class="arrange --row --divided-children-1">
                <div class="arrange --padding-relation --center">
                    <div class="-text -text-size-120">
                        Tiempo total de la ronda
                    </div>
                    <div class="-text -text-bold">
                        {{ attempt?._totalTimeFormat?.format || '-' }}
                    </div>
                </div>
            </div>

            <div class="arrange --column">
                <div class="-title -title-size-160">Listado de tarjetas</div>
                <div class="arrange --row --gap-joined --center">
                    <ng-container *ngFor="let item of attempt.questions; let i = index">
                        <button class="small" [ngClass]="{'correct': item.isCorrect }" (click)="gotoQuestion(i)">
                            {{ i + 1 }}
                            <div class="-text -text-size-80">{{ item._totalTime?.format }}</div>
                        </button>
                    </ng-container>
                </div>
            </div>

            <div class="item arrange centers paddings">
                <button (click)="showQuiz()">
                    <div class="inner">
                        <span class="material-icons">
                            rule
                        </span>
                        Revisar las tarjetas
                    </div>
                </button>
            </div>

        </div>
    </ng-container>
</div>
