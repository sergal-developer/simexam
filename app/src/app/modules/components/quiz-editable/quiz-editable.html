<div class="arrange --full-screen" *ngIf="formDescription">
    <div class="arrange --full-screen --gap-0 glass glass-no-border">
        <!-- MODULE HEADER -->
        <div class="arrange --width-screen --padding-group --padding-bottom-0 --height-8-vh" *ngIf="headerActive">
            <div class="arrange --row-nowrap --align-center --justify-between --width-100">
                <ng-container>
                    <div class="item" (click)="gotoDashboard()">
                        <lu-icon [icon]="luIcon.back"></lu-icon>
                    </div>
                    <div class="arrange --width-100">
                        <mat-input class="arrange --width-100" [title]="'form_title' | translate"
                            [mesageError]="'form_title_required' | translate"
                            [formControl]="formDescription.get('title')" (onChange)="updateValue($event)">
                        </mat-input>
                    </div>
                </ng-container>
            </div>
        </div>

        <!-- CONTAINER GENERIC -->
        <ng-container *ngIf="questionary">
            <type-generic [questionary]="questionary" [translateLabels]="translateLabels"
                (onChange)="onChangeChildren($event)"></type-generic>
        </ng-container>
    </div>
</div>
