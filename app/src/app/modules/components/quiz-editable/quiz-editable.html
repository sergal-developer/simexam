<div class="_animation_state" *ngIf="formDescription">
    <div class="root-container quiz-form">
        <div class="arrage stacked spaceBetween">
            <div class="item" (click)="gotoDashboard()">
                <lu-icon [icon]="luIcon.back"></lu-icon>
            </div>
            <div class="item">
                <mat-input [title]="'form_title' | translate" [mesageError]="'form_title_required' | translate"
                    [formControl]="formDescription.get('title')" (onChange)="updateValue($event)">
                </mat-input>
            </div>
            <div class="item">
                <mat-select [title]="'form_type' | translate" [mesageError]="'form_type_required' | translate"
                    [options]="types" displayProperty="name" valueProperty="id" placeholder=""
                    [formControl]="formDescription.get('type')" (selectionChange)="updateValue($event)">
                </mat-select>
            </div>
        </div>

        <ng-container *ngIf="questionary">
            <type-generic [questionary]="questionary" [translateLabels]="translateLabels"
                (onChange)="onChangeChildren($event)"></type-generic>
        </ng-container>
    </div>
</div>
