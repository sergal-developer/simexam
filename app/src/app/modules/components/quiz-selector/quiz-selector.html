<div class="_animation_state">
    <div class="all-screen-section">
        <section-dinamic design="glass">
            <div class="arrage centers paddings-relation">
                <div class="item" (click)="gotoDashboard()">
                    <lu-icon [icon]="luIcon.back"></lu-icon>
                </div>
                <h4>Plantillas Genericas</h4>
            </div>
            <div class="arrage stacked paddings">
                <button class="item" (click)="createNewBlank('questionaries')">
                    <lu-icon [icon]="luIcon.list"></lu-icon>
                    <div>Examen</div>
                </button>

                <button class="item"  (click)="createNewBlank('simple')">
                    <lu-icon [icon]="luIcon.cards"></lu-icon>
                    <div>Tarjetas</div>
                </button>

                <button class="item" (click)="createNewBlank('true-false')">
                    <lu-icon [icon]="luIcon.drama"></lu-icon>
                    <div>Verdadero / Falso</div>
                </button>

                <button class="item" (click)="createNewBlank('popularity')">
                    <lu-icon [icon]="luIcon.poll"></lu-icon>
                    <div>Encuesta</div>
                </button>

                <button class="item" (click)="createNewBlank('math')">
                    <lu-icon [icon]="luIcon.aritmetic"></lu-icon>
                    <div>Calcular</div>
                </button>

            </div>
        </section-dinamic>
    </div>

    <div class="root-container quiz-form">

        <section-dinamic design="glass">
            <div class="arrage centers paddings">
                <h4>Plantillas en Linea ( <b>{{ listFilesFiltered.length }}</b> )</h4>
                <button class="link" (click)="resetFilter()" *ngIf="currentFilter">reset</button>
            </div>
            <div class="arrage centers paddings">
                <div class="item" (click)="filterBy('questionaries')">
                    <lu-icon [icon]="luIcon.list"></lu-icon>
                    <div>Examen</div>
                </div>

                <div class="item" (click)="filterBy('simple')">
                    <lu-icon [icon]="luIcon.cards"></lu-icon>
                    <div>Tarjetas</div>
                </div>

                <div class="item" (click)="filterBy('true-false')">
                    <lu-icon [icon]="luIcon.drama"></lu-icon>
                    <div>Verdadero / Falso</div>
                </div>

                <div class="item" (click)="filterBy('popularity')">
                    <lu-icon [icon]="luIcon.poll"></lu-icon>
                    <div>Encuesta</div>
                </div>
            </div>

            <div class="arrage columns paddings">
                <div class="item" *ngFor="let item of listFilesFiltered">
                    <div class="arrage">
                        <div class="item">
                            <lu-icon [icon]="luIcon.list" *ngIf="item.type == 'questionaries'"></lu-icon>
                            <lu-icon [icon]="luIcon.cards" *ngIf="item.type == 'simple'"></lu-icon>
                            <lu-icon [icon]="luIcon.drama" *ngIf="item.type == 'true-false'"></lu-icon>
                            <lu-icon [icon]="luIcon.poll" *ngIf="item.type == 'popularity'"></lu-icon>
                        </div>
                        <div class="item">{{ item._name }}</div>
                        <div class="item">
                            <button class="primary" (click)="getFile(item)">
                                Obtener <lu-icon [icon]="luIcon.download" ></lu-icon>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </section-dinamic>

    </div>
</div>
