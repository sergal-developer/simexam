<div class="_animation_state">
    <div class="all-screen-section">
        <section-dinamic design="glass">
            <div class="arrage spaceBetween paddings-relation">
                <div class="item" (click)="gotoDashboard()">
                    <lu-icon [icon]="luIcon.back"></lu-icon>
                </div>
                <h3>Plantillas Genericas</h3>
            </div>
            <div class="arrage row paddings-relation gaps-joined _2">
                <button class="square" (click)="createNewBlank('trivia')">
                    <lu-icon [icon]="luIcon.trivia"></lu-icon>
                    <div>{{ 'quiz_type_trivia' | translate }}</div>
                </button>

                <button class="square" (click)="createNewBlank('simple')">
                    <lu-icon [icon]="luIcon.simple"></lu-icon>
                    <div>{{ 'quiz_type_simple' | translate }}</div>
                </button>

                <button class="square" (click)="createNewBlank('true-false')">
                    <lu-icon [icon]="luIcon.trueFalse"></lu-icon>
                    <div>{{ 'quiz_type_true_false' | translate }}</div>
                </button>

                <button class="square" (click)="createNewBlank('popularity')">
                    <lu-icon [icon]="luIcon.popularity"></lu-icon>
                    <div>{{ 'quiz_type_popularity' | translate }}</div>
                </button>

                <button class="square" (click)="createNewBlank('reading')">
                    <lu-icon [icon]="luIcon.reading"></lu-icon>
                    <div>{{ 'quiz_type_reading' | translate }}</div>
                </button>

                <button class="square" (click)="createNewBlank('math-quest')">
                    <lu-icon [icon]="luIcon.mathQuest"></lu-icon>
                    <div>{{ 'quiz_type_math_quest' | translate }}</div>
                </button>

            </div>
        </section-dinamic>
    </div>

    <div class="root-container quiz-form">

        <section-dinamic design="glass">
            <div class="arrage centers paddings">
                <h3>Plantillas en Linea ( <b>{{ listFilesFiltered.length }}</b> )</h3>
                <button class="link" (click)="resetFilter()" *ngIf="currentFilter">reset</button>
            </div>
            <div class="arrage centers gaps-joined">
                <button class="square" (click)="filterBy('trivia')">
                    <lu-icon [icon]="luIcon.trivia"></lu-icon>
                    <div>{{ 'quiz_type_trivia' | translate }}</div>
                </button>

                <button class="square" (click)="filterBy('simple')">
                    <lu-icon [icon]="luIcon.simple"></lu-icon>
                    <div>{{ 'quiz_type_simple' | translate }}</div>
                </button>

                <button class="square" (click)="filterBy('true-false')">
                    <lu-icon [icon]="luIcon.trueFalse"></lu-icon>
                    <div>{{ 'quiz_type_true_false' | translate }}</div>
                </button>

                <button class="square" (click)="filterBy('popularity')">
                    <lu-icon [icon]="luIcon.popularity"></lu-icon>
                    <div>{{ 'quiz_type_popularity' | translate }}</div>
                </button>
            </div>

            <div class="arrage columns paddings">
                <div class="arrage left spaceBetween" *ngFor="let quiz of listFilesFiltered">
                    <div class="item">
                        <button class="accent" (click)="getFile(quiz)">
                            <lu-icon [icon]="luIcon.download"></lu-icon>
                        </button>
                    </div>
                    <div class="item">
                        <lu-icon [icon]="luIcon.martQuest" *ngIf="quiz.type == 'math-quest'"></lu-icon>
                        <lu-icon [icon]="luIcon.popularity" *ngIf="quiz.type == 'popularity'"></lu-icon>
                        <lu-icon [icon]="luIcon.reading" *ngIf="quiz.type == 'reading'"></lu-icon>
                        <lu-icon [icon]="luIcon.simple" *ngIf="quiz.type == 'simple'"></lu-icon>
                        <lu-icon [icon]="luIcon.trivia" *ngIf="quiz.type == 'trivia'"></lu-icon>
                        <lu-icon [icon]="luIcon.trueFalse" *ngIf="quiz.type == 'true-false'"></lu-icon>
                    </div>
                    <div class="item">
                        <p>{{ quiz._name }}</p>
                    </div>
                </div>

            </div>
        </section-dinamic>

    </div>
</div>
